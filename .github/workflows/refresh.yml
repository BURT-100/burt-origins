name: Refresh upcoming entrants

# Weekly: re-pull the upcoming edition's UltraSignup entrant lists, rebuild the page, and
# commit if anything changed. Past editions come from the name-free files in data/public/.
on:
  schedule:
    - cron: "0 15 * * 1"   # Mondays 15:00 UTC (8am Pacific in summer, 7am in winter)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cache GeoNames places
        uses: actions/cache@v4
        with:
          path: data/ref/us_places.tsv
          key: geonames-us-places-v1

      - run: ./pipeline/fetch_ref.sh places

      - name: Refresh entrants
        run: python pipeline/refresh_upcoming.py
        env:
          BURT_KEY_SECRET: ${{ secrets.BURT_KEY_SECRET }}

      - name: Rebuild page
        run: |
          python pipeline/metrics.py > /dev/null
          python pipeline/build_map.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upcoming.json data/public data/metrics.csv docs site
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh upcoming entrants ($(date -u +%Y-%m-%d))"
            git push
          fi
